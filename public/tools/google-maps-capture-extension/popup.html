<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebView Maps Capture</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        padding: 14px;
        font-family: Arial, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      p {
        margin: 0 0 12px;
        color: #475569;
        font-size: 12px;
        line-height: 1.4;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        padding: 0 12px;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        color: #fff;
        background: #4f46e5;
        border-color: #4f46e5;
      }
      button.secondary {
        color: #334155;
        background: #fff;
        border-color: #cbd5e1;
      }
      a {
        color: #334155;
        background: #fff;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        min-height: 34px;
        margin: 0 0 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 0 9px;
        font-size: 12px;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 150px;
        margin-top: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 8px;
        font-family: Consolas, monospace;
        font-size: 11px;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .status {
        margin-top: 8px;
        min-height: 16px;
        color: #4338ca;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>WebView Maps Capture</h1>
    <p>Open Google Maps first. This copies visible listings or the open detail panel as JSON for the `/admin/leads` manual import box.</p>
    <input id="adminOrigin" type="url" value="https://webview.click" aria-label="WebView admin origin" />
    <div class="actions">
      <button id="capture" type="button">Capture visible Maps data</button>
      <button id="post" type="button" class="secondary">Post to admin</button>
      <a href="https://webview.click/admin/leads" target="_blank" rel="noreferrer">Open admin</a>
    </div>
    <div id="status" class="status"></div>
    <textarea id="output" readonly placeholder="Captured JSON appears here."></textarea>
    <script src="popup.js"></script>
  </body>
</html>
