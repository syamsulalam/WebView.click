name: API Handler Tests

on:
  workflow_dispatch:

jobs:
  api-handlers:
    name: npm run test:api-handlers
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API handler fixtures
        run: npm run test:api-handlers
